<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life — a cellular automaton</title>
<style>
  :root{
    --ground:#0a1114;
    --panel:#0f1b20;
    --panel-2:#12242a;
    --line:#1c333a;
    --text:#c4d4d0;
    --muted:#7c918d;
    --accent:#37d9c0;
    --accent-dim:#1f7f74;
    --danger:#e07a6a;
    --radius:10px;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--text);
    background:
      radial-gradient(120% 90% at 50% -10%, #10242a 0%, var(--ground) 60%);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(19,36,42,.65),rgba(15,27,32,.4));
    flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
  .brand h1{
    margin:0;
    font-size:19px;
    font-weight:650;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .brand h1 b{color:var(--accent);font-weight:650}
  .brand span{font-size:11px;color:var(--muted);letter-spacing:.05em}

  .readouts{display:flex;gap:26px}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:74px}
  .stat .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .stat .v{
    font-family:var(--mono);
    font-size:22px;
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .stat .v.live{color:var(--accent)}
  .status-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--muted);margin-right:7px;vertical-align:middle;
  }
  .status-dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}

  /* stage */
  .stage{position:relative;flex:1;min-height:0;overflow:hidden}
  #glow,#grid{position:absolute;inset:0;width:100%;height:100%;display:block}
  #glow{filter:blur(9px);opacity:.55;mix-blend-mode:screen;pointer-events:none}
  #grid{cursor:crosshair}
  .stage::after{ /* vignette */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(4,9,11,.55) 100%);
  }
  .hint{
    position:absolute;left:16px;bottom:14px;z-index:3;
    font-size:11px;color:var(--muted);letter-spacing:.03em;
    background:rgba(10,17,20,.6);padding:6px 10px;border-radius:7px;
    border:1px solid var(--line);pointer-events:none;
  }
  .hint b{color:var(--text);font-weight:600}
  .hint.armed{color:var(--accent);border-color:var(--accent-dim)}

  /* controls */
  footer{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 20px;border-top:1px solid var(--line);
    background:linear-gradient(0deg,rgba(19,36,42,.6),rgba(15,27,32,.35));
  }
  .cluster{display:flex;align-items:center;gap:8px}
  .divider{width:1px;height:26px;background:var(--line)}
  .grow{flex:1}

  button{
    font-family:var(--sans);font-size:13px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:border-color .15s,background .15s,color .15s,transform .05s;
  }
  button:hover{border-color:var(--accent-dim);color:#e6f6f2}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{
    background:linear-gradient(180deg,#2fbfa9,#1f9787);
    border-color:#37d9c0;color:#05201c;font-weight:650;min-width:104px;justify-content:center;
  }
  button.primary:hover{filter:brightness(1.07);color:#04120f}
  button.ghost{background:transparent}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  button.chip.armed{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim) inset}

  .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:130px;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent-dim) 100%);
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#eafff9;border:2px solid var(--accent);box-shadow:0 0 8px var(--accent-dim);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:#eafff9;
    border:2px solid var(--accent);box-shadow:0 0 8px var(--accent-dim);
  }
  .rate{font-family:var(--mono);font-size:12px;color:var(--muted);width:52px;font-variant-numeric:tabular-nums}

  .toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent);width:14px;height:14px}

  @media (max-width:720px){
    .readouts{gap:16px}
    .brand span{display:none}
    footer{gap:10px}
    input[type=range]{width:96px}
  }
  @media (prefers-reduced-motion:reduce){
    button{transition:none}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Con<b>way</b> · Life</h1>
      <span>a cellular automaton — cells are born, survive, and die by their neighbours</span>
    </div>
    <div class="readouts">
      <div class="stat">
        <div class="k">Generation</div>
        <div class="v" id="genOut">0</div>
      </div>
      <div class="stat">
        <div class="k">Population</div>
        <div class="v live" id="popOut">0</div>
      </div>
      <div class="stat">
        <div class="k">Status</div>
        <div class="v" id="statusOut" style="font-size:15px;padding-top:4px">
          <span class="status-dot" id="dot"></span><span id="statusText">Paused</span>
        </div>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="glow"></canvas>
    <canvas id="grid"></canvas>
    <div class="hint" id="hint"><b>Drag</b> to draw · <b>right-drag</b> to erase · <b>Space</b> to run</div>
  </div>

  <footer>
    <div class="cluster">
      <button class="primary" id="playBtn">▶ Run</button>
      <button class="ghost" id="stepBtn" title="Advance one generation (S)">⏭ Step</button>
    </div>
    <div class="divider"></div>
    <div class="cluster">
      <span class="label">Speed</span>
      <input type="range" id="speed" min="1" max="40" value="12">
      <span class="rate" id="rateOut">12/s</span>
    </div>
    <div class="divider"></div>
    <div class="cluster">
      <button class="ghost" id="randBtn" title="Fill with random soup (R)">🎲 Random</button>
      <button class="ghost danger" id="clearBtn" title="Clear the board (C)">✕ Clear</button>
    </div>
    <div class="divider"></div>
    <div class="cluster" id="patterns">
      <span class="label">Stamp</span>
      <button class="chip" data-pat="glider">Glider</button>
      <button class="chip" data-pat="lwss">Ship</button>
      <button class="chip" data-pat="pulsar">Pulsar</button>
      <button class="chip" data-pat="gun">Gun</button>
      <button class="chip" data-pat="soup">Soup</button>
    </div>
    <div class="grow"></div>
    <div class="cluster">
      <label class="toggle"><input type="checkbox" id="wrapChk" checked>Wrap edges</label>
    </div>
  </footer>

<script>
(() => {
  "use strict";
  const gridC = document.getElementById('grid');
  const glowC = document.getElementById('glow');
  const gctx = gridC.getContext('2d');
  const bctx = glowC.getContext('2d');
  const stage = document.querySelector('.stage');

  const CELL = 14;            // css px per cell
  let cols=0, rows=0, dpr=1;
  let cur, nxt, age;          // Uint8 / Uint16 grids
  let running=false, generation=0, population=0;
  let speed=12, wrap=true;
  let armed=null;             // pattern chip currently armed for stamping

  // Colour by age: newborn -> near-white, settling to teal, old cooling to cyan.
  const AGE_STOPS=14;
  const palette=[];
  for(let a=0;a<=AGE_STOPS;a++){
    const t=a/AGE_STOPS;
    const hue=166+t*30;         // 166 teal -> 196 cyan
    const sat=72+t*14;
    const light=84-t*32;        // bright new -> cooler old
    palette.push(`hsl(${hue} ${sat}% ${light}%)`);
  }
  const colOf=a=>palette[a>AGE_STOPS?AGE_STOPS:a];

  function alloc(nc,nr){
    const nCur=new Uint8Array(nc*nr);
    const nAge=new Uint16Array(nc*nr);
    if(cur){ // preserve overlap on resize
      const cc=Math.min(cols,nc), rr=Math.min(rows,nr);
      for(let y=0;y<rr;y++)for(let x=0;x<cc;x++){
        nCur[y*nc+x]=cur[y*cols+x];
        nAge[y*nc+x]=age[y*cols+x];
      }
    }
    cols=nc; rows=nr; cur=nCur; nxt=new Uint8Array(nc*nr); age=nAge;
  }

  function resize(){
    const w=stage.clientWidth, h=stage.clientHeight;
    dpr=Math.min(window.devicePixelRatio||1,2);
    for(const c of [gridC,glowC]){
      c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    }
    gctx.setTransform(dpr,0,0,dpr,0,0);
    bctx.setTransform(dpr,0,0,dpr,0,0);
    const nc=Math.max(4,Math.floor(w/CELL)), nr=Math.max(4,Math.floor(h/CELL));
    if(nc!==cols||nr!==rows) alloc(nc,nr);
    render();
  }

  // The four rules of Life, computed into nxt.
  function step(){
    const W=cols,H=rows;
    for(let y=0;y<H;y++){
      const yUp=(y-1+H)%H, yDn=(y+1)%H;
      for(let x=0;x<W;x++){
        let n;
        if(wrap){
          const xL=(x-1+W)%W, xR=(x+1)%W;
          n=cur[yUp*W+xL]+cur[yUp*W+x]+cur[yUp*W+xR]
           +cur[y*W+xL]              +cur[y*W+xR]
           +cur[yDn*W+xL]+cur[yDn*W+x]+cur[yDn*W+xR];
        }else{
          n=0;
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            if(!dx&&!dy)continue;
            const xx=x+dx, yy=y+dy;
            if(xx<0||xx>=W||yy<0||yy>=H)continue;
            n+=cur[yy*W+xx];
          }
        }
        const i=y*W+x, alive=cur[i];
        const live=alive ? (n===2||n===3) : (n===3);
        nxt[i]=live?1:0;
        age[i]=live?(alive?Math.min(age[i]+1,65535):1):0;
      }
    }
    [cur,nxt]=[nxt,cur];
    generation++;
    render();
    updateReadouts();
  }

  function render(){
    const w=gridC.width/dpr, h=gridC.height/dpr;
    gctx.clearRect(0,0,w,h);
    gctx.fillStyle='#0a1114'; gctx.fillRect(0,0,w,h);
    // faint lattice
    gctx.strokeStyle='rgba(28,51,58,.5)'; gctx.lineWidth=1;
    gctx.beginPath();
    for(let x=0;x<=cols;x++){const px=Math.round(x*CELL)+.5;gctx.moveTo(px,0);gctx.lineTo(px,rows*CELL);}
    for(let y=0;y<=rows;y++){const py=Math.round(y*CELL)+.5;gctx.moveTo(0,py);gctx.lineTo(cols*CELL,py);}
    gctx.stroke();
    // cells
    let pop=0;
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const i=y*cols+x;
        if(!cur[i])continue;
        pop++;
        gctx.fillStyle=colOf(age[i]);
        gctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
      }
    }
    population=pop;
    // bloom pass: cheap phosphor glow
    bctx.clearRect(0,0,w,h);
    bctx.drawImage(gridC,0,0,w,h);
  }

  function updateReadouts(){
    document.getElementById('genOut').textContent=generation.toLocaleString();
    document.getElementById('popOut').textContent=population.toLocaleString();
  }

  function setRunning(v){
    running=v;
    const btn=document.getElementById('playBtn');
    btn.textContent=v?'❚❚ Pause':'▶ Run';
    document.getElementById('dot').classList.toggle('on',v);
    document.getElementById('statusText').textContent=v?'Running':'Paused';
  }

  function clear(){
    cur.fill(0); age.fill(0); generation=0; render(); updateReadouts();
  }
  function randomize(){
    for(let i=0;i<cur.length;i++){const a=Math.random()<0.28?1:0;cur[i]=a;age[i]=a?1:0;}
    generation=0; render(); updateReadouts();
  }

  // ---- patterns (relative coordinates) ----
  const P={
    glider:[[1,0],[2,1],[0,2],[1,2],[2,2]],
    lwss:[[0,0],[3,0],[4,1],[0,2],[4,2],[1,3],[2,3],[3,3],[4,3]],
    pulsar:(()=>{
      const base=[[2,0],[3,0],[4,0],[0,2],[5,2],[0,3],[5,3],[0,4],[5,4],[2,5],[3,5],[4,5]];
      const pts=[];
      const quad=(fx,fy,ox,oy)=>base.forEach(([x,y])=>pts.push([ox+fx*x,oy+fy*y]));
      quad(1,1,0,0); quad(-1,1,13,0); quad(1,-1,0,13); quad(-1,-1,13,13);
      return pts;
    })(),
    gun:[
      [24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],
      [11,3],[15,3],[20,3],[21,3],[34,3],[35,3],
      [0,4],[1,4],[10,4],[16,4],[20,4],[21,4],
      [0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],
      [10,6],[16,6],[24,6],[11,7],[15,7],[12,8],[13,8]
    ],
    soup:(()=>{const p=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(Math.random()<0.5)p.push([x,y]);return p;})()
  };

  function stamp(pat,cx,cy){
    let list=P[pat];
    if(pat==='soup'){ // fresh soup each time
      list=[];for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(Math.random()<0.5)list.push([x,y]);
    }
    let maxX=0,maxY=0;
    for(const [x,y] of list){if(x>maxX)maxX=x;if(y>maxY)maxY=y;}
    const ox=cx-((maxX/2)|0), oy=cy-((maxY/2)|0);
    for(const [x,y] of list){
      let gx=ox+x, gy=oy+y;
      if(wrap){gx=(gx%cols+cols)%cols;gy=(gy%rows+rows)%rows;}
      else if(gx<0||gx>=cols||gy<0||gy>=rows)continue;
      const i=gy*cols+gx; cur[i]=1; age[i]=1;
    }
    render(); updateReadouts();
  }

  // ---- pointer drawing ----
  let drawing=0; // 0 none, 1 paint, 2 erase
  function cellAt(e){
    const r=gridC.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/CELL);
    const y=Math.floor((e.clientY-r.top)/CELL);
    if(x<0||x>=cols||y<0||y>=rows)return null;
    return {x,y,i:y*cols+x};
  }
  function paint(e){
    const c=cellAt(e); if(!c)return;
    if(drawing===1){cur[c.i]=1;age[c.i]=age[c.i]||1;}
    else{cur[c.i]=0;age[c.i]=0;}
    render(); updateReadouts();
  }
  gridC.addEventListener('contextmenu',e=>e.preventDefault());
  gridC.addEventListener('pointerdown',e=>{
    const c=cellAt(e); if(!c)return;
    e.preventDefault(); gridC.setPointerCapture(e.pointerId);
    if(armed){ stamp(armed,c.x,c.y); disarm(); return; }
    drawing=(e.button===2)?2:1;
    paint(e);
  });
  gridC.addEventListener('pointermove',e=>{ if(drawing)paint(e); });
  window.addEventListener('pointerup',()=>{drawing=0;});

  // ---- controls ----
  function arm(pat,btn){
    disarm();
    armed=pat; btn.classList.add('armed');
    const h=document.getElementById('hint');
    h.classList.add('armed');
    h.innerHTML=`Click the grid to place the <b>${btn.textContent}</b> · Esc to cancel`;
  }
  function disarm(){
    armed=null;
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('armed'));
    const h=document.getElementById('hint');
    h.classList.remove('armed');
    h.innerHTML='<b>Drag</b> to draw · <b>right-drag</b> to erase · <b>Space</b> to run';
  }
  document.getElementById('patterns').addEventListener('click',e=>{
    const btn=e.target.closest('.chip'); if(!btn)return;
    const pat=btn.dataset.pat;
    if(armed===pat) disarm(); else arm(pat,btn);
  });

  document.getElementById('playBtn').onclick=()=>setRunning(!running);
  document.getElementById('stepBtn').onclick=()=>{ if(running)setRunning(false); step(); };
  document.getElementById('clearBtn').onclick=()=>{ setRunning(false); clear(); };
  document.getElementById('randBtn').onclick=()=>{ randomize(); };
  const speedEl=document.getElementById('speed');
  speedEl.oninput=()=>{speed=+speedEl.value;document.getElementById('rateOut').textContent=speed+'/s';};
  const wrapEl=document.getElementById('wrapChk');
  wrapEl.onchange=()=>{wrap=wrapEl.checked;};

  window.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    switch(e.key){
      case ' ': e.preventDefault(); setRunning(!running); break;
      case 's': case 'S': if(running)setRunning(false); step(); break;
      case 'c': case 'C': setRunning(false); clear(); break;
      case 'r': case 'R': randomize(); break;
      case 'Escape': disarm(); break;
    }
  });

  // ---- main loop ----
  let acc=0,last=0;
  function frame(ts){
    if(!last)last=ts;
    acc+=ts-last; last=ts;
    if(running){
      const interval=1000/speed;
      let guard=0;
      while(acc>=interval && guard<8){ step(); acc-=interval; guard++; }
      if(acc>interval*4)acc=0;
    }else acc=0;
    requestAnimationFrame(frame);
  }

  // ---- boot ----
  const ro=new ResizeObserver(resize); ro.observe(stage);
  resize();
  // seed with a couple of gliders so it's alive on open
  stamp('gun', (cols*0.28)|0, (rows*0.35)|0);
  stamp('pulsar',(cols*0.72)|0,(rows*0.6)|0);
  updateReadouts();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
