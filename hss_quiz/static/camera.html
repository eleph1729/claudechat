<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSS Answer Camera</title>
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --ink: #1a1c22; --dim: #646b78; --line: #e2e0da;
    --accent: #c4613f; --good: #1f9d63; --bad: #d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --panel: #151922; --ink: #f2f4f8; --dim: #9aa3b5; --line: #2a3142;
      --accent: #d97757; --good: #3ecf8e; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 16px;
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 4px; }
  .q { font-weight: 600; }
  input[type=text] { width: 100%; font-size: 17px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button, .btn { display: block; width: 100%; font-size: 18px; font-weight: 700; padding: 14px; border-radius: 12px;
    border: 0; background: var(--accent); color: #fff; text-align: center; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; }
  #file { display: none; }
  img.preview { width: 100%; border-radius: 10px; display: block; }
  .status { color: var(--dim); }
  .pass { color: var(--good); font-weight: 800; } .fail { color: var(--bad); font-weight: 800; }
  .err { color: var(--bad); }
  ul { padding-left: 1.1em; margin: 6px 0 0; } li { margin: 4px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Humanity's Sixth Sense · answer camera</h1>
  <div class="card"><div class="label" id="qlabel">Current question</div><div class="q" id="q">Connecting…</div></div>
  <div class="card">
    <div class="label">Your name or team</div>
    <input type="text" id="name" maxlength="40" placeholder="Audience" autocomplete="off">
  </div>
  <label class="btn" for="file" id="take">📷 Photograph your answer</label>
  <input type="file" id="file" accept="image/*" capture="environment">
  <div class="card hidden" id="previewCard">
    <img class="preview" id="preview" alt="Your photo">
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="secondary" id="retake">Retake</button>
      <button id="send">Send</button>
    </div>
  </div>
  <div class="card hidden" id="result"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current = null, blob = null, pollTimer = null;
try { $("name").value = localStorage.getItem("hss-name") || ""; } catch (e) {}
$("name").addEventListener("change", () => { try { localStorage.setItem("hss-name", $("name").value); } catch (e) {} });

async function refreshQuestion() {
  try {
    const q = await (await fetch("/api/camera/question", {cache: "no-store"})).json();
    if (q.offline) { $("q").textContent = "The show is running offline, so photo answers can't be graded right now."; $("take").classList.add("hidden"); return; }
    if (!q.task_id) { current = null; $("qlabel").textContent = "Current question"; $("q").textContent = q.index < 0 ? "The show hasn't started yet." : "The show is over. Thanks for playing!"; $("take").classList.add("hidden"); return; }
    if (!current || current.task_id !== q.task_id) {
      current = q; $("qlabel").textContent = `Question ${q.index + 1} of ${q.total}`; $("q").textContent = q.prompt;
      $("take").classList.remove("hidden"); resetPhoto();
    }
  } catch (e) { $("q").textContent = "Can't reach the quiz server. Same Wi-Fi as the host?"; }
}

function resetPhoto() { blob = null; $("file").value = ""; $("previewCard").classList.add("hidden"); }

// Shrink big phone photos before upload; the browser applies EXIF rotation when drawing.
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), "image/jpeg", 0.88));
  } catch (e) { return file; }
}

$("file").addEventListener("change", async () => {
  const f = $("file").files[0]; if (!f) return;
  blob = await shrink(f);
  $("preview").src = URL.createObjectURL(blob);
  $("previewCard").classList.remove("hidden");
});
$("retake").addEventListener("click", () => { resetPhoto(); $("file").click(); });
$("send").addEventListener("click", async () => {
  if (!blob || !current) return;
  $("send").disabled = true;
  const fd = new FormData();
  fd.append("photo", blob, "answer.jpg"); fd.append("name", $("name").value); fd.append("task_id", current.task_id);
  showResult(`<div class="status">Uploading…</div>`);
  try {
    const r = await fetch("/api/camera", {method: "POST", body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    resetPhoto(); watch(j.task_id, j.id);
  } catch (e) { showResult(`<div class="err">Couldn't send: ${esc(e.message)}</div>`); }
  $("send").disabled = false;
});

function showResult(html) { $("result").innerHTML = html; $("result").classList.remove("hidden"); }

function watch(taskId, id) {
  clearInterval(pollTimer);
  const step = async () => {
    try {
      const s = await (await fetch(`/api/camera/${taskId}/${id}`, {cache: "no-store"})).json();
      let html = `<div class="label">Your answer</div>`;
      if (s.transcription) html += `<div>Claude read: “${esc(s.transcription)}”</div>`;
      if (s.status === "reading") html += `<div class="status">Claude is reading your handwriting…</div>`;
      else if (s.status === "grading") html += `<div class="status">Grading against the rubric…</div>`;
      else if (s.status === "error") { html += `<div class="err">${esc(s.error)}</div>`; clearInterval(pollTimer); }
      else if (s.status === "done" && !s.revealed) html += `<div class="status" style="margin-top:8px">Graded ✓ Your result appears on the big screen when the host reveals the answer.</div>`;
      else if (s.status === "done") {
        const j = s.judgment;
        html += `<div style="margin-top:8px" class="${j.passed ? "pass" : "fail"}">${j.passed ? "PASS: every rubric point met" : "FAIL"}</div><ul>` +
          j.criteria.map((c) => `<li>${c.met ? "✓" : "✗"} ${esc(c.title)}</li>`).join("") + `</ul>`;
        clearInterval(pollTimer);
      }
      showResult(html);
    } catch (e) { /* keep polling */ }
  };
  step(); pollTimer = setInterval(step, 1500);
}

refreshQuestion(); setInterval(refreshQuestion, 2000);
</script>
</body>
</html>
