<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Newton's Cradle</title>
<style>
  :root {
    --ink: rgba(235, 240, 248, 0.92);
    --ink-dim: rgba(235, 240, 248, 0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #05060a;
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  /* soft cinematic vignette over the 3D view */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(16px, 3.5vmin, 40px);
    color: var(--ink);
    opacity: 0; animation: fadein 1.6s ease 0.4s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }

  #title h1 {
    font-size: clamp(15px, 2.2vmin, 22px);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
  }
  #title p {
    margin-top: 8px;
    font-size: clamp(10px, 1.4vmin, 13px);
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-shadow: 0 1px 10px rgba(0,0,0,0.8);
  }

  #controls {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    pointer-events: none;
  }
  #controls .group {
    pointer-events: auto;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(10, 13, 20, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  #controls .label {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim); padding: 0 4px 0 8px;
  }
  #controls button {
    appearance: none; border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.05);
    color: var(--ink);
    font: inherit; font-size: 12px; letter-spacing: 0.08em;
    min-width: 34px; height: 30px; padding: 0 12px;
    border-radius: 999px; cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
  }
  #controls button:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.22); }
  #controls button:active { transform: scale(0.94); }
  #controls button.toggled-off { color: var(--ink-dim); }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #05060a; color: var(--ink-dim);
    font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase;
    transition: opacity 0.8s ease; z-index: 10;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="hud">
  <div id="title">
    <h1>Newton&rsquo;s Cradle</h1>
    <p>drag a ball &nbsp;&middot;&nbsp; drag the dark to orbit &nbsp;&middot;&nbsp; scroll to zoom</p>
  </div>
  <div id="controls">
    <div class="group">
      <span class="label">Lift</span>
      <button data-lift="1">1</button>
      <button data-lift="2">2</button>
      <button data-lift="3">3</button>
    </div>
    <div class="group">
      <button id="btn-reset">Reset</button>
      <button id="btn-sound">Sound&ensp;On</button>
    </div>
  </div>
</div>

<div id="loading">Newton&rsquo;s Cradle</div>

<script src="three.min.js"></script>
<script src="cradle.js"></script>
</body>
</html>
